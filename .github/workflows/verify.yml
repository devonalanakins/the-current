name: Verify synthetic application
on:
  push:
    branches: ["implementation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run scan:secrets
      - run: npm run release:package -- /tmp/the-current-release
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Record exact source identity
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/checkout-commit.txt
          git rev-parse HEAD^{tree} > artifacts/checkout-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-verification
          path: |
            artifacts/ui
            artifacts/checkout-commit.txt
            artifacts/checkout-tree.txt
            playwright-report
          retention-days: 7
